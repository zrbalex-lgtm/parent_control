# Build and test the Windows guard; publish a self-contained win-x64 build as an artifact.
name: Windows guard

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test windows/ParentControl.slnx -c Release --logger "console;verbosity=normal"

      - name: Publish guard
        run: >
          dotnet publish windows/Guard.Service/Guard.Service.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o publish/guard

      - name: Smoke test (help)
        shell: pwsh
        run: |
          & publish/guard/ParentControl.Guard.exe --help
          if ($LASTEXITCODE -ne 0) { throw "help failed: $LASTEXITCODE" }
          & publish/guard/ParentControl.Guard.exe probe
          if ($LASTEXITCODE -ne 0) { throw "probe failed: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: parent-control-guard-win-x64
          path: publish/guard
          retention-days: 30
