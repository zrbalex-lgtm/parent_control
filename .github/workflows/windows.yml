# Build and test the Windows guard; publish a self-contained win-x64 build as an artifact.
name: Windows guard

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # create GitHub Releases for auto-update
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test windows/ParentControl.slnx -c Release --logger "console;verbosity=normal"

      - name: Publish guard
        run: >
          dotnet publish windows/Guard.Service/Guard.Service.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o publish/guard

      - name: Smoke test (help)
        shell: pwsh
        run: |
          & publish/guard/ParentControl.Guard.exe --help
          if ($LASTEXITCODE -ne 0) { throw "help failed: $LASTEXITCODE" }
          & publish/guard/ParentControl.Guard.exe probe
          if ($LASTEXITCODE -ne 0) { throw "probe failed: $LASTEXITCODE" }

      - name: Add installer to the package
        shell: pwsh
        run: Copy-Item windows/installer/* publish/guard/ -Force

      # End-to-end: install as a real service (no registration), update in place, uninstall.
      - name: Installer test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'pc-install'
          & .\publish\guard\install.ps1 -NoRegister -NoPause -InstallDir $dir
          if ($LASTEXITCODE) { throw "install failed: $LASTEXITCODE" }
          Start-Sleep -Seconds 5
          $svc = Get-Service ParentControlGuard
          if ($svc.Status -ne 'Running') { throw "service not running: $($svc.Status)" }
          if ($svc.StartType -ne 'Automatic') { throw "start type: $($svc.StartType)" }
          $run = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').ParentControlTray
          if ($run -notlike '*ParentControl.Guard.exe" tray') { throw "run key: $run" }
          $fail = & sc.exe qfailure ParentControlGuard | Out-String
          if ($fail -notmatch 'RESTART') { throw "recovery not set: $fail" }
          if (-not (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SafeBoot\Minimal\ParentControlGuard')) { throw 'safe mode key missing' }
          & schtasks.exe /Query /TN 'ParentControl Watchdog' | Out-Null
          if ($LASTEXITCODE) { throw 'watchdog task missing' }
          Write-Host 'install ok'

          # Fail-safe: the service keeps running without appsettings.json and after the data folder is wiped.
          if (-not (Test-Path 'HKLM:\SOFTWARE\ParentControl')) { throw 'registry backup key missing' }
          Stop-Service ParentControlGuard
          Remove-Item "$dir\appsettings.json" -Force
          Remove-Item "$env:ProgramData\ParentControl" -Recurse -Force
          Start-Service ParentControlGuard
          Start-Sleep -Seconds 8
          if ((Get-Service ParentControlGuard).Status -ne 'Running') { throw 'service did not start without config' }
          if (-not (Test-Path "$env:ProgramData\ParentControl\state.json")) { throw 'data folder not recreated' }
          & "$dir\ParentControl.Guard.exe" clear-tamper
          if ($LASTEXITCODE) { throw "clear-tamper failed: $LASTEXITCODE" }
          Start-Sleep -Seconds 8
          if (Test-Path "$env:ProgramData\ParentControl\clear-tamper.flag") { throw 'clear-tamper flag not picked up' }
          & "$dir\ParentControl.Guard.exe" status
          if ($LASTEXITCODE) { throw "status failed: $LASTEXITCODE" }
          # Watchdog brings a stopped service back.
          Stop-Service ParentControlGuard
          & "$dir\ParentControl.Guard.exe" watchdog
          Start-Sleep -Seconds 5
          if ((Get-Service ParentControlGuard).Status -ne 'Running') { throw 'watchdog did not start the service' }
          Write-Host 'fail-safe ok'

          & .\publish\guard\install.ps1 -NoRegister -NoPause -InstallDir $dir
          if ($LASTEXITCODE) { throw "update failed: $LASTEXITCODE" }
          if ((Get-Service ParentControlGuard).Status -ne 'Running') { throw 'service not running after update' }
          Write-Host 'update ok'

          # Unattended update path used by the service (backup, install, verify).
          & .\publish\guard\update.ps1 -InstallDir $dir -Log (Join-Path $env:RUNNER_TEMP 'update.log')
          if ($LASTEXITCODE) { Get-Content (Join-Path $env:RUNNER_TEMP 'update.log'); throw "update.ps1 failed: $LASTEXITCODE" }
          if ((Get-Service ParentControlGuard).Status -ne 'Running') { throw 'service not running after update.ps1' }
          Write-Host 'self-update script ok'

          & "$dir\ParentControl.Guard.exe" unblock-logon
          if ($LASTEXITCODE) { throw "unblock-logon failed: $LASTEXITCODE" }
          & .\publish\guard\reset-logon.ps1 -NoPause
          if ($LASTEXITCODE) { throw "reset-logon failed: $LASTEXITCODE" }
          Write-Host 'logon reset ok'

          & "$dir\uninstall.ps1" -NoPause -RemoveData -InstallDir $dir
          if ($LASTEXITCODE) { throw "uninstall failed: $LASTEXITCODE" }
          if (Get-Service ParentControlGuard -ErrorAction SilentlyContinue) {
            $s = Get-CimInstance Win32_Service -Filter "Name='ParentControlGuard'"
            if ($s) { throw 'service still installed' }
          }
          if (Test-Path $dir) { throw 'install folder left' }
          if (Test-Path 'HKLM:\SOFTWARE\ParentControl') { throw 'registry backup left' }
          $ErrorActionPreference = 'Continue'
          & schtasks.exe /Query /TN 'ParentControl Watchdog' 2>&1 | Out-Null
          if (-not $LASTEXITCODE) { throw 'watchdog task left' }
          $ErrorActionPreference = 'Stop'
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').ParentControlTray) { throw 'run key left' }
          Write-Host 'uninstall ok'
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: parent-control-guard-win-x64
          path: publish/guard
          retention-days: 30

      # A new version (Directory.Build.props) on main becomes a GitHub Release; installed guards pick it up.
      - name: Release for auto-update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content windows/Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag exists; nothing to publish"; exit 0 }
          $asset = 'parent-control-guard-win-x64.zip'
          Compress-Archive -Path publish/guard/* -DestinationPath $asset -Force
          $item = Get-Item $asset
          $sha = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ version = $version; asset = $asset; sha256 = $sha; size = $item.Length } | ConvertTo-Json | Set-Content manifest.json -Encoding utf8NoBOM
          Get-Content manifest.json
          gh release create $tag $asset manifest.json --title "Guard $version" --notes "Built from ${{ github.sha }}. Installed guards update automatically." --latest
          if ($LASTEXITCODE) { throw "release failed" }
